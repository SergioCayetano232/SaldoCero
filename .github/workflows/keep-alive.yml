# Mantiene despierto el proyecto de Supabase.
# El plan gratuito lo pausa a los 7 dias sin actividad, asi que lo tocamos
# dos veces por semana.
name: Keep alive

on:
  schedule:
    - cron: "0 9 * * 1,4" # lunes y jueves a las 9:00 UTC
  workflow_dispatch: # y a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la base de datos
        run: |
          curl -sS -f -m 30 -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/abrir_viaje" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"codigo_buscado":"PING"}' \
            -o /dev/null

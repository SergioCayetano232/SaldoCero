# Mantiene despierto el proyecto de Supabase.
# El plan gratuito lo pausa a los 7 dias sin actividad. Antes lo tocabamos dos
# veces por semana llamando a abrir_viaje con un codigo falso, y aun asi se
# pauso: esa llamada casi no hace trabajar a la base de datos. Ahora cada dia
# y con una lectura de verdad.
name: Keep alive

on:
  schedule:
    - cron: "17 9 * * *" # cada dia a las 9:17 UTC (a en punto GitHub va saturado y se retrasa)
  workflow_dispatch: # y a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      CLAVE: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      # Si faltan los secrets, que lo diga claro en vez de un error raro de curl.
      - name: Comprobar los secrets
        run: |
          if [ -z "$URL" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan SUPABASE_URL o SUPABASE_ANON_KEY en Settings > Secrets > Actions"
            exit 1
          fi

      # Una consulta a una tabla de verdad. Las reglas no dejan ver ningun viaje
      # sin su codigo, asi que vuelve vacia, pero la base de datos la ejecuta.
      - name: Leer de la base de datos
        run: |
          curl -sS -f -m 30 --retry 3 --retry-delay 60 --retry-all-errors \
            "$URL/rest/v1/viajes?select=id&limit=1" \
            -H "apikey: $CLAVE" \
            -H "Authorization: Bearer $CLAVE"

      - name: Llamar a una funcion
        run: |
          curl -sS -f -m 30 --retry 3 --retry-delay 60 --retry-all-errors -X POST \
            "$URL/rest/v1/rpc/abrir_viaje" \
            -H "apikey: $CLAVE" \
            -H "Authorization: Bearer $CLAVE" \
            -H "Content-Type: application/json" \
            -d '{"codigo_buscado":"PING"}'

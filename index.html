<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7c7b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1518" media="(prefers-color-scheme: dark)" />

    <!-- Para poder instalarla en el móvil. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SaldoCero" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Reparte los gastos del viaje entre amigos. Apunta quién paga qué y te decimos quién le debe a quién." />

    <!-- La tarjeta que sale al pegar la invitación en WhatsApp. La imagen tiene
         que ir con la dirección entera, con una relativa no la carga. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SaldoCero" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Únete al viaje en SaldoCero" />
    <meta property="og:description" content="Apunta lo que pagas y al volver sabréis quién le debe a quién." />
    <meta property="og:image" content="https://saldo-cero-eight.vercel.app/icono-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />

    <!-- Que vaya abriendo la conexión con Supabase mientras carga lo demás. El
         crossorigin hace falta: sin él abre una conexión que luego no usa. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>SaldoCero · Reparte los gastos del viaje</title>

    <!-- El tema antes de pintar nada, que si no se ve un fogonazo blanco. Es lo
         mismo que temaQueToca, en src/tema.js. -->
    <script>
      try {
        var tema = localStorage.getItem("saldocero-tema");
      } catch (e) {}
      var oscuro = tema === "oscuro" || (tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.tema = oscuro ? "oscuro" : "claro";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
